<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ClipNote — 个人 Agent 提示词记事本" />
  <title>ClipNote · 提示词记事本</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📎</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">📎</span>
        <div class="brand-text">
          <h1>ClipNote</h1>
          <span class="brand-sub">常用 Agent 提示词记事本</span>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="search" placeholder="搜索标题、内容或标签…  (Ctrl+K)" autocomplete="off" />
      </div>

      <div class="topbar-actions">
        <button id="themeBtn" class="btn btn-ghost" title="切换深色 / 浅色模式">
          <span id="themeIcon">🌙</span>
        </button>
        <button id="cloudBtn" class="btn btn-ghost" title="云端存档：恢复 / 备份">☁️ 云端</button>
        <button id="exportBtn" class="btn btn-ghost" title="导出全部提示词为 JSON 备份">导出</button>
        <button id="importBtn" class="btn btn-ghost" title="从 JSON 备份导入">导入</button>
        <input id="importFile" type="file" accept=".json,application/json" hidden />
        <button id="newBtn" class="btn btn-primary">＋ 新建提示词</button>
      </div>
    </header>

    <div class="layout">
      <!-- 侧边栏：标签筛选 -->
      <aside class="sidebar">
        <nav id="filterNav" class="filter-nav">
          <button class="filter-item active" data-filter="__all__">
            <span>🗂️ 全部</span><span class="count" id="countAll">0</span>
          </button>
          <button class="filter-item" data-filter="__pinned__">
            <span>⭐ 收藏</span><span class="count" id="countPinned">0</span>
          </button>
        </nav>
        <div class="sidebar-title">标签</div>
        <nav id="tagNav" class="filter-nav tag-nav"></nav>
        <div class="sidebar-foot">
          <label class="sort-label" for="sortSelect">排序</label>
          <select id="sortSelect">
            <option value="updated">最近编辑</option>
            <option value="created">最近创建</option>
            <option value="used">最近使用</option>
            <option value="count">使用次数</option>
          </select>
          <div id="statsLine" class="stats-line"></div>
        </div>
      </aside>

      <!-- 主区域：卡片列表 -->
      <main class="main">
        <div id="cardGrid" class="card-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-emoji">🗒️</div>
          <h2>还没有提示词</h2>
          <p>把你常用的 Agent Prompt 存到这里，随时搜索、一键复制。</p>
          <button id="emptyNewBtn" class="btn btn-primary">＋ 新建第一条提示词</button>
        </div>
        <div id="noResultState" class="empty-state" hidden>
          <div class="empty-emoji">🔍</div>
          <h2>没有匹配的结果</h2>
          <p>换个关键词试试，或清除搜索条件。</p>
          <button id="clearSearchBtn" class="btn btn-ghost">清除搜索</button>
        </div>
      </main>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div id="editorOverlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="editorTitle">新建提示词</h3>
        <button id="editorClose" class="btn btn-ghost btn-icon" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">标题 <em>*</em></span>
          <input id="fTitle" type="text" maxlength="100" placeholder="例如：代码审查助手" />
        </label>
        <label class="field">
          <span class="field-label">标签 <small>（用空格或逗号分隔）</small></span>
          <input id="fTags" type="text" placeholder="例如：编码 agent 日常工作" />
        </label>
        <label class="field">
          <span class="field-label">提示词内容 <em>*</em></span>
          <textarea id="fContent" rows="12" spellcheck="false" placeholder="把完整的 Prompt 粘贴到这里…"></textarea>
        </label>
      </div>
      <div class="modal-foot">
        <span id="charCount" class="char-count">0 字</span>
        <div class="modal-foot-btns">
          <button id="editorCancel" class="btn btn-ghost">取消</button>
          <button id="editorSave" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 云端存档弹窗 -->
  <div id="cloudOverlay" class="overlay" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>☁️ 云端存档</h3>
        <button id="cloudClose" class="btn btn-ghost btn-icon" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <p class="cloud-desc">存档保存在 GitHub 仓库 <code>ctzcs/ClipNote</code> 的 <code>data/prompts.json</code>。
        恢复会把云端存档<strong>合并</strong>到本机（不会删除本地已有条目）；备份会用本机数据<strong>覆盖</strong>云端存档。<br>
        <span class="cloud-warn">注意：存档内容在公开仓库中任何人可见，不要存放敏感提示词。</span></p>
        <div class="cloud-actions">
          <button id="cloudRestore" class="btn btn-primary">⬇️ 从云端恢复</button>
          <button id="cloudBackup" class="btn btn-ghost">⬆️ 备份到云端</button>
        </div>
        <label class="field">
          <span class="field-label">GitHub Token <small>（仅「备份到云端」需要。建议申请 Fine-grained Token，只授予本仓库的 Contents 读写权限；Token 只保存在本机浏览器里）</small></span>
          <input id="fToken" type="password" placeholder="github_pat_… 或 ghp_…" autocomplete="off" />
        </label>
        <div class="cloud-token-row">
          <button id="cloudSaveToken" class="btn btn-ghost">保存 Token</button>
          <button id="cloudClearToken" class="btn btn-ghost">清除 Token</button>
          <span id="cloudTokenState" class="cloud-state"></span>
        </div>
        <div id="cloudStatus" class="cloud-state"></div>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div id="confirmOverlay" class="overlay" hidden>
    <div class="modal modal-sm" role="alertdialog" aria-modal="true">
      <div class="modal-body">
        <h3 style="margin:0">确认删除？</h3>
        <p id="confirmText" class="confirm-text">删除后无法恢复。</p>
      </div>
      <div class="modal-foot">
        <div></div>
        <div class="modal-foot-btns">
          <button id="confirmCancel" class="btn btn-ghost">取消</button>
          <button id="confirmOk" class="btn btn-danger">删除</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
